blueprint:
  name: Sensmos – komunikator z domem bez internetu
  description: >-
    Messenger (firmware 0.17-kom) → your Sensmos node at home → Home Assistant, all over radio and the
    local network, no internet needed. Each message "#n text" gets a confirmation "ok #n" sent back by the
    node's radio, plus your pending reply if there is one, and a notification on your phone.
    The node should be in Point mode (app → node → LoRa → Frame reception). /
    Komunikator (firmware 0.17-kom) → Twój nod Sensmos w domu → Home Assistant, radiem i siecią lokalną,
    bez internetu. Każda wiadomość dostaje potwierdzenie radiem noda i Twoją odpowiedź, jeśli czeka.
    Range test (firmware 0.18-kom): "t #n" gets a silent "ok #n", no notification.
    Reply straight from the notification (Home Assistant app): a quick reply goes out by radio at once, a later one
    waits in the reply helper for the messenger's next "?" question. "I'm safe" goes to the whole family list. /
    Test zasięgu (0.18-kom): na „t #n” idzie ciche „ok #n”, bez powiadomienia.
    Odpowiedź prosto z powiadomienia w aplikacji Home Assistant. „Jestem bezpieczny” idzie do wszystkich bliskich.
  domain: automation
  source_url: https://github.com/sensmos-network/sensmos-homeassistant/blob/main/blueprints/automation/sensmos/komunikator_dom.yaml
  input:
    node:
      name: Node at home / Nod w domu
      description: The Sensmos node with a LoRa radio that the messenger sends to (its id8 is set in the messenger).
      selector:
        device:
          integration: sensmos
    sub:
      name: Messenger sensor number (sub) / Numer komunikatora (sub)
      description: The same number as in the app, messenger → Home without internet.
      default: 9
      selector:
        number:
          min: 1
          max: 255
          mode: box
    notify_service:
      name: Notify service / Usługa powiadomień
      description: For example notify.mobile_app_my_phone. Empty = no notification.
      default: ""
      selector:
        text:
    reply:
      name: Reply helper (optional) / Pomocnik z odpowiedzią (opcjonalnie)
      description: >-
        An input_text helper. Whatever you type there goes back to the messenger with the next confirmation
        or the next "?" question (the messenger asks every few minutes), then the helper is cleared.
      default: ""
      selector:
        entity:
          domain: input_text
    name:
      name: Messenger owner / Czyj komunikator
      description: Shown to the family, e.g. "Piotr".
      default: Komunikator
      selector:
        text:
    family:
      name: Family for "I'm safe" / Bliscy do „Jestem bezpieczny” (optional)
      description: >-
        Notify services separated by commas. A message "jestem bezpieczny", "jestem ok", "I'm safe", "bin sicher"
        or "estou bem" goes to all of them at once, from the field without internet, through your home's connection.
      default: ""
      selector:
        text:

mode: parallel
max: 5

variables:
  node: !input node
  sub: !input sub
  notify_service: !input notify_service
  reply_entity: !input reply
  owner: !input name
  family: !input family
  family_list: "{{ family.split(',') | map('trim') | reject('eq', '') | list }}"

trigger:
  - platform: event
    event_type: sensmos_lora_frame

condition:
  - condition: template
    value_template: "{{ trigger.event.data.device_id == node and (trigger.event.data.sub | int(0)) == (sub | int) }}"

action:
  - variables:
      t0: "{{ now().timestamp() }}"
      reply_action: "SENSMOS_KOM_REPLY_{{ context.id }}"
      text: "{{ trigger.event.data.text or '' }}"
      dst: "{{ (trigger.event.data.node_id or '')[:8] }}"
      num: >-
        {% set m = text | regex_findall('^#(\d+) ') %}{{ m[0] if m else '' }}
      body: >-
        {{ text | regex_replace('^#\d+ ', '') }}
      pending: >-
        {% set p = states(reply_entity) if reply_entity else '' %}{{ '' if p in ['unknown', 'unavailable', 'none'] else p[:90] }}
      ping: >-
        {% set m = text | regex_findall('^t #(\d+)$') %}{{ m[0] if m else '' }}
  - choose:
      - conditions: "{{ ping != '' }}"
        sequence:
          - service: sensmos.lora_send
            data:
              device_id: "{{ node }}"
              dst: "{{ dst }}"
              sub: "{{ sub | int }}"
              payload: "ok #{{ ping }}"
              aes: true
      - conditions: "{{ num != '' }}"
        sequence:
          - service: sensmos.lora_send
            data:
              device_id: "{{ node }}"
              dst: "{{ dst }}"
              sub: "{{ sub | int }}"
              payload: "ok #{{ num }}{{ '|' ~ pending if pending else '' }}"
              aes: true
          - if: "{{ pending != '' }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: "{{ reply_entity }}"
                data:
                  value: ""
          # „Jestem bezpieczny”: z pola bez internetu przez łącze domu do wszystkich bliskich naraz.
          - if: >-
              {{ family_list | count > 0 and body | lower | trim is
                 search('^(jestem bezpieczn\\w*|jestem ok|wszystko ok|i.?m safe|i am safe|safe|bin sicher|mir geht es gut|estou bem|estou segur[oa])[.! ]*$') }}
            then:
              - repeat:
                  for_each: "{{ family_list }}"
                  sequence:
                    - service: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ owner }}: jestem bezpieczny"
                        message: "{{ body }} (przez komunikator Sensmos, {{ now().strftime('%H:%M') }})"
          - if: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: Sensmos – komunikator
                  message: "{{ body }}"
                  data:
                    tag: "sensmos-kom-{{ sub }}"
                    actions:
                      - action: "{{ reply_action }}"
                        title: Odpowiedz / Reply
                        behavior: textInput
              # Odpowiedź wpisana prosto w powiadomieniu (aplikacja Home Assistant, Android i iOS).
              - wait_for_trigger:
                  - platform: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ reply_action }}"
                timeout: { minutes: 30 }
                continue_on_timeout: false
              - variables:
                  answer: "{{ (wait.trigger.event.data.reply_text or '') | trim | truncate(90, true, '') }}"
                  quick: "{{ now().timestamp() - t0 < 50 }}"
              - choose:
                  - conditions: "{{ answer == '' }}"
                    sequence: []
                  # Komunikator słucha jeszcze minutę po wysłaniu: szybka odpowiedź idzie od razu radiem.
                  - conditions: "{{ quick or not reply_entity }}"
                    sequence:
                      - service: sensmos.lora_send
                        data:
                          device_id: "{{ node }}"
                          dst: "{{ dst }}"
                          sub: "{{ sub | int }}"
                          payload: "ok|{{ answer }}"
                          aes: true
                  # Później: odpowiedź czeka w pomocniku i jedzie z następnym pytaniem „?” albo potwierdzeniem.
                  - conditions: "{{ true }}"
                    sequence:
                      - service: input_text.set_value
                        target:
                          entity_id: "{{ reply_entity }}"
                        data:
                          value: "{{ answer }}"
      - conditions: "{{ text == '?' and pending != '' }}"
        sequence:
          - service: sensmos.lora_send
            data:
              device_id: "{{ node }}"
              dst: "{{ dst }}"
              sub: "{{ sub | int }}"
              payload: "ok|{{ pending }}"
              aes: true
          - service: input_text.set_value
            target:
              entity_id: "{{ reply_entity }}"
            data:
              value: ""
